unbind-key -a

bind ^D detach

bind ^a command-prompt
bind ^r command-prompt "rename-wind %%"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind t new-window
bind d split-window -v -c "#{pane_current_path}"
bind r split-window -h -c "#{pane_current_path}"
bind q previous-window
bind e next-window
bind x kill-window

bind c kill-pane
bind z resize-pane -Z
bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7
bind-key -r f run-shell "tmux neww tms"
bind [ copy-mode

bind-key 1 selectw -t 1
bind-key 2 selectw -t 2
bind-key 3 selectw -t 3
bind-key 4 selectw -t 4
bind-key 5 selectw -t 5
bind-key 6 selectw -t 6
bind-key 7 selectw -t 7
bind-key 8 selectw -t 8
bind-key 9 selectw -t 9
bind-key 0 selectw -t 0

bind R source-file ~/.config/tmux/tmux.conf
